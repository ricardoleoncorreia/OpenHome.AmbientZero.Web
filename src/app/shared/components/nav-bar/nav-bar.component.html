@if(tabs(); as tabsCollection)
{
<div class="custom-navbar-container" role="tablist" (keydown)="onKeydown($event)">
    @for(tab of tabsCollection; track tab.id; let i = $index)
    {
    <button #tabButton type="button" role="tab" [id]="tab.selectorId" class="tab-item" [class.active]="index() === i"
        [class.disabled]="!tab.enabled" [attr.aria-selected]="index() === i"
        [attr.aria-disabled]="tab.enabled ? null : true" [tabIndex]="index() === i ? 0 : -1"
        [tuiHint]="tab.enabled ? null : tab.hint" tuiHintDirection="bottom" (click)="setActive(i)">
        <tui-icon [icon]="tab.icon" />
        <span class="tab-wrapper"></span>
        <span class="tab-text">{{tab.label}}</span>
    </button>
    }
</div>
}
